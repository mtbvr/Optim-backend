spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/optdb}
    username: ${SPRING_DATASOURCE_USERNAME:opt}
    password: ${SPRING_DATASOURCE_PASSWORD:opt}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  forward-headers-strategy: framework

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-please-change-me-please-change-me-32}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      cookie-name: access_token
    cookie:
      secure: ${COOKIE_SECURE:true}
      same-site: ${COOKIE_SAME_SITE:Strict}
      domain: ${COOKIE_DOMAIN:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  pixel-wars:
    width: ${PIXEL_WARS_WIDTH:120}
    height: ${PIXEL_WARS_HEIGHT:80}
    cooldown-seconds: ${PIXEL_WARS_COOLDOWN_SECONDS:8}
    red-color: "#E50000"
    blue-color: "#0083C7"
    placement-points: 1
    line-combo-length: 5
    line-combo-bonus: 10
    square-combo-size: 3
    square-combo-bonus: 15
    capture-bonus-per-pixel: 3
